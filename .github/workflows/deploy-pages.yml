name: Deploy to GitHub Pages

# Only for the GitHub Pages option, and only when started by hand:
# Actions > "Deploy to GitHub Pages" > Run workflow. It never runs by itself.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build for https://<owner>.github.io/<repository>/
        run: npm run build
        env:
          # A "project site" lives under /<repository>/, so Vite needs that base path.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Repository variables (Settings > Secrets and variables > Actions > Variables).
          # They are not secrets: they end up in the public site code.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SPREADSHEET_ID: ${{ vars.VITE_SPREADSHEET_ID }}
          VITE_GOOGLE_ACCOUNT_HINT: ${{ vars.VITE_GOOGLE_ACCOUNT_HINT }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
